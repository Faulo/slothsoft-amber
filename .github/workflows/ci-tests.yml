name: CI Tests

on: [ push ]

jobs:
    windows-startup-diagnostic:
        name: Discover Windows ${{ matrix.path }}
        runs-on: windows-2025
        strategy:
            fail-fast: false
            matrix:
                path: [ "tests/API", "tests/Assets", "tests/CLI", "tests/Controller", "tests/ParameterFilters", "tests/SavegameImplementations", "tests/AmberUtilsTest.php", "tests/AmberUserTest.php" ]
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.2"
                    extensions: "ctype, curl, dom, gd, iconv, imagick, json, libxml, mbstring, pcre, phar, sockets, tokenizer, xml, xmlwriter, xsl, zip, zlib"
                    tools: composer:v2
                    coverage: none
                env:
                    fail-fast: true
            -   name: Install dependencies
                run: composer update --prefer-stable --no-interaction --no-progress
                env:
                    COMPOSER_ROOT_VERSION: "dev-main"
                    COMPOSER_AUTH: "{}"
            -   name: Discover PHPUnit tests
                timeout-minutes: 2
                run: php vendor/bin/phpunit --list-tests ${{ matrix.path }} > phpunit-tests.txt

    run-tests:
        name: PHP ${{ matrix.php }} (${{ matrix.composer }}) on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ "ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025" ]
                composer: [ "lowest", "stable" ]
                php: [ "8.2", "8.3", "8.4", "8.5" ]
                extensions: [ "ctype, curl, dom, gd, iconv, imagick, json, libxml, mbstring, pcre, phar, sockets, tokenizer, xml, xmlwriter, xsl, zip, zlib" ]
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: ${{ matrix.extensions }}
                    tools: composer:v2
                    coverage: none
                env:
                    fail-fast: true

            -   name: Cache Composer dependencies
                uses: actions/cache@v6
                with:
                    path: /tmp/composer-cache
                    key: ${{ matrix.os }}-php-${{ matrix.php }}-composer-${{ matrix.composer }}-${{ hashFiles('composer.json') }}

            -   name: Install dependencies
                run: composer update --prefer-${{ matrix.composer }} --no-interaction --no-progress
                env:
                    COMPOSER_ROOT_VERSION: "dev-main"
                    COMPOSER_CACHE_DIR: /tmp/composer-cache
                    COMPOSER_AUTH: "{}"

            -   name: Run PHPUnit
                if: runner.os != 'Windows'
                run: vendor/bin/phpunit --log-junit phpunit-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.composer }}.results.xml

            -   name: Run PHPUnit on Windows
                if: runner.os == 'Windows'
                timeout-minutes: 5
                run: |
                    php vendor/bin/phpunit --debug --log-junit phpunit-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.composer }}.results.xml 2>&1 | Tee-Object -FilePath phpunit-windows.log
                    exit $LASTEXITCODE

            -   name: Upload Test Results
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: results-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.composer }}
                    path: |
                        phpunit-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.composer }}.results.xml
                        phpunit-windows.log
    
    publish-results:
        name: Publish Results
        runs-on: ubuntu-latest
        needs: run-tests
        if: always()
        
        steps:
            -   name: Download Artifacts
                uses: actions/download-artifact@v8
                with:
                    path: artifacts

            -   name: Publish Unit Test Results
                uses: EnricoMi/publish-unit-test-result-action@v2
                with:
                    files: artifacts/**/*.xml
